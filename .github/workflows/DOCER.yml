name: DOCER (context rot)

on: pull_request

# Two independent jobs:
#   referential — vendored DOCER (git-grep) audits CLAUDE.md for code
#                 references that no longer exist. Catches renamed/moved/
#                 deleted symbols and paths. Comments on the PR.
#   semantic    — LLM auditor catches what DOCER structurally cannot:
#                 count rot, phantom architecture, contradictions.
#                 Gated on structural diffs. Referential BLOCKS the PR on
#                 findings; semantic is WARN-ONLY (LLM shouldn't gate merges yet).

jobs:
  referential:
    name: Referential rot (DOCER)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: repo
          fetch-depth: 0   # DOCER walks history for the doc-snapshot revision

      - name: Assemble vendored DOCER tool
        run: |
          cp -r repo/.github/docer tool
          mkdir -p wiki output   # empty wiki dir: this fork scans CLAUDE.md, not a GitHub wiki

      - name: Run DOCER (referential rot in CLAUDE.md)
        env:
          LC_ALL: C.UTF-8   # git grep -P needs a UTF-8 locale
          LANG: C.UTF-8
        run: |
          pip install pandas numpy
          bash tool/analysis.sh

          echo 'report<<EOF' >> "$GITHUB_ENV"
          python tool/report.py "${{ github.repository }}" "${{ github.run_id }}" >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"

      - name: Comment on pull request
        if: ${{ env.report }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.report
            })

      - name: Upload artifact
        if: ${{ env.report }}
        uses: actions/upload-artifact@v4
        with:
          name: docer-report
          path: |
            output/report.csv
            output/summary.csv
            output/summary.md

      # Hard gate: fail the check when stale references were found. The comment
      # and artifact steps above already ran. env.report is non-empty only when
      # report.py emitted outdated references.
      - name: Fail if referential rot found
        if: ${{ env.report }}
        run: |
          echo "::error::DOCER found stale references in AI config files — see the PR comment."
          exit 1

  semantic:
    name: Semantic rot (LLM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # AUDIT mode grounds each AI config file against the CURRENT repo facts
      # (npm scripts, prisma schema count, tracked paths) — so it catches count /
      # contradiction / phantom rot even when this PR's diff didn't cause it. A
      # diff-scoped (pr) check would miss those. WARN-ONLY: it surfaces findings
      # in the log scoreboard but never blocks a merge — an LLM's judgment
      # shouldn't gate people's PRs on day one. (Referential IS the hard gate.)
      - name: Semantic context-rot audit (LLM)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ROT_MODEL: claude-sonnet-4-6   # override to raise/lower the audit model
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret set — skipping semantic audit (add the secret to enable)."
            exit 0
          fi
          # Limit to the AI-config files (not human README/VISION) to keep cost down.
          node .github/docer/context-rot-check.mjs audit --files CLAUDE.md AGENTS.md \
            || echo "::warning::Semantic audit errored — not blocking the PR."
          exit 0
